# Don't forget to surround abstract with double quotes
abstract: "HierarchicalDet trains one diffusion-based detector across three tiers of DENTEX
           panoramic X-ray annotation and attributes its accuracy gain to a noisy-box
           manipulation scheme that feeds predictions from an earlier tier into the
           denoising process of the next. No trained weights are released, so any
           reproduction has to retrain the whole three-stage pipeline. We did so on
           free-tier Kaggle hardware under a 900-iteration budget per stage. The resulting
           models reach 6 to 13 percent of the reported AP, so this is a failed
           reproduction, and the shortfall is attributable to our budget rather than to
           the original work. Within that budget the direction of the manipulation
           ablation held at all three tiers, although per-class results show the
           tier-level gap is carried almost entirely by one easy class. The
           weight-transfer ablation inverted: the variant that is strongest in the paper
           collapsed to zero AP for us, which is what a short schedule predicts. Two
           findings do not depend on our budget. The public DENTEX test release carries
           no Deep Caries label at all, so it supports three of the four diagnosis
           classes and the reported diagnosis numbers cannot be recomputed from public
           data by anyone. The release also states two different licences for the same
           dataset. We report per-class AP, sampling-step latency, corruption sensitivity
           and failure-mode counts, none of which the original paper covers, and we say
           plainly which of them are informative at this training scale and which are
           not."

